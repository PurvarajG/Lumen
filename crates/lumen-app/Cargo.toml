[package]
name = "lumen-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lumen"
path = "src/main.rs"

[dependencies]
lumen-core = { path = "../lumen-core" }
lumen-media = { path = "../lumen-media" }
lumen-control = { path = "../lumen-control" }
lumen-interchange = { path = "../lumen-interchange" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "x11", "wayland"] }
egui = "=0.33.3"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

# eframe's wgpu feature intentionally leaves backend selection to downstreams.
# Enable Metal for the first delivery platform while retaining eframe's shared
# std/wgsl feature selection.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=27.0.1", default-features = false, features = ["metal"] }
objc2 = "=0.5.3"
objc2-app-kit = { version = "=0.2.2", features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "=0.2.2", features = ["NSThread"] }
