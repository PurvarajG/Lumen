<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient: Dark Graphite -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23262B" />
      <stop offset="100%" stop-color="#121316" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3E434D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E2024" stop-opacity="0.4" />
    </linearGradient>

    <!-- Saffron Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC247" />
      <stop offset="50%" stop-color="#F2A33A" />
      <stop offset="100%" stop-color="#D95214" />
    </linearGradient>

    <!-- Inner Core Flame Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="50%" stop-color="#FFE699" />
      <stop offset="100%" stop-color="#FFB347" />
    </linearGradient>

    <!-- Diya / Lamp Base Gradient -->
    <linearGradient id="lampGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A4E58" />
      <stop offset="100%" stop-color="#1F2126" />
    </linearGradient>

    <!-- Flame Ambient Glow -->
    <radialGradient id="flameGlow" cx="50%" cy="52%" r="35%">
      <stop offset="0%" stop-color="#F2A33A" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#F2A33A" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#F2A33A" stop-opacity="0" />
    </radialGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App Icon Squircle (824x824, radius 185, centered at 512,512) -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" filter="url(#dropShadow)" />

  <!-- Ambient Glow behind flame -->
  <circle cx="512" cy="510" r="300" fill="url(#flameGlow)" />

  <!-- Diya / Lamp Bowl -->
  <path d="M 330 634 C 400 710, 624 710, 694 634 C 674 656, 620 676, 512 676 C 404 676, 350 656, 330 634 Z" fill="url(#lampGrad)" stroke="#5B606B" stroke-width="2" />

  <!-- Outer Saffron Flame -->
  <path d="M 512 294 C 575 384, 640 464, 640 554 C 640 624, 580 654, 512 654 C 444 654, 384 624, 384 554 C 384 464, 449 384, 512 294 Z" fill="url(#flameGrad)" />

  <!-- Inner Flame Core -->
  <path d="M 512 414 C 545 464, 570 514, 570 564 C 570 604, 545 629, 512 629 C 479 629, 454 604, 454 564 C 454 514, 479 464, 512 414 Z" fill="url(#coreGrad)" />
</svg>
